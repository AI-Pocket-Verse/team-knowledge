<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Brand mark, mirroring the header brand: the open-book glyph from
       BookFlipIcon (24×24 viewBox), Feishu-blue (#3370ff) stroke on a
       TRANSPARENT background — no rounded-square badge. Scaled ~1.3× around
       the glyph centre (12, 11.5) so the book fills the icon (legible at 16px);
       stroke scales with it to ~2.3, matching the bolder look. -->
  <g transform="translate(12 11.5) scale(1.3) translate(-12 -11.5)"
     fill="none" stroke="#3370ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 6.2C14.5 5.2 18 5 20.5 5.4L20.5 16.8C18 16.4 14.5 16.6 12 18Z"/>
    <path d="M12 6.2C9.5 5.2 6 5 3.5 5.4L3.5 16.8C6 16.4 9.5 16.6 12 18Z"/>
    <path d="M12 6.2V18"/>
  </g>
</svg>
